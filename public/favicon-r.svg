<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <style>
      .r1 { animation: o1 2.4s linear infinite; transform-origin: 50% 50%; }
      .r2 { animation: o2 1.9s linear infinite; transform-origin: 50% 50%; }
      .r3 { animation: o3 3.1s linear infinite; transform-origin: 50% 50%; }
      @keyframes o1 { from { transform: rotate(0deg);   } to { transform: rotate(360deg);  } }
      @keyframes o2 { from { transform: rotate(60deg);  } to { transform: rotate(420deg);  } }
      @keyframes o3 { from { transform: rotate(-60deg); } to { transform: rotate(300deg);  } }
    </style>
    <radialGradient id="bg" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#0d2040"/>
      <stop offset="100%" stop-color="#050e1c"/>
    </radialGradient>
    <linearGradient id="txt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#61afff"/>
      <stop offset="100%" stop-color="#5dcaa5"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <circle cx="16" cy="16" r="16" fill="url(#bg)"/>
  <circle cx="16" cy="16" r="15" fill="none" stroke="#378add" stroke-width="0.6" opacity="0.4"/>

  <!-- Orbit ring 1 — blue -->
  <g class="r1">
    <ellipse cx="16" cy="16" rx="11" ry="4" fill="none" stroke="#378add" stroke-width="0.8" opacity="0.55"/>
    <circle cx="16" cy="12" r="2" fill="#378add" opacity="0.95"/>
  </g>

  <!-- Orbit ring 2 — green -->
  <g class="r2">
    <ellipse cx="16" cy="16" rx="11" ry="4" fill="none" stroke="#5dcaa5" stroke-width="0.8" opacity="0.5"/>
    <circle cx="16" cy="12" r="1.7" fill="#5dcaa5" opacity="0.95"/>
  </g>

  <!-- Orbit ring 3 — light blue -->
  <g class="r3">
    <ellipse cx="16" cy="16" rx="11" ry="4" fill="none" stroke="#61afff" stroke-width="0.8" opacity="0.45"/>
    <circle cx="16" cy="12" r="1.5" fill="#61afff" opacity="0.95"/>
  </g>

  <!-- Center core -->
  <circle cx="16" cy="16" r="6.5" fill="#0a1828" stroke="#378add" stroke-width="0.7" opacity="0.85"/>

  <!-- </> text -->
  <text x="16" y="18.5" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="5.5" font-weight="900" fill="url(#txt)">&lt;/&gt;</text>
</svg>
