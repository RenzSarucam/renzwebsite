<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <radialGradient id="sphere" cx="35%" cy="28%" r="75%">
      <stop offset="0%" stop-color="#7a7a7a"/>
      <stop offset="45%" stop-color="#2d2d2d"/>
      <stop offset="100%" stop-color="#080808"/>
    </radialGradient>
    <radialGradient id="shine" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ball" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#b5b5b5"/>
      <stop offset="100%" stop-color="#555555"/>
    </radialGradient>
  </defs>

  <!-- soft ground shadow -->
  <ellipse cx="16" cy="29.2" rx="9" ry="1.6" fill="#000" opacity="0.35"/>

  <!-- back half of both orbits (behind the sphere) -->
  <g fill="none" stroke="#e5e5e5" stroke-width="1.1" opacity="0.5">
    <ellipse cx="16" cy="16" rx="14" ry="5" transform="rotate(-28 16 16)"/>
    <ellipse cx="16" cy="16" rx="14" ry="5" transform="rotate(32 16 16)"/>
  </g>

  <!-- sphere -->
  <circle cx="16" cy="16" r="8.2" fill="url(#sphere)"/>
  <ellipse cx="13.2" cy="12.6" rx="3.2" ry="2.1" fill="url(#shine)" transform="rotate(-25 13.2 12.6)"/>

  <!-- </> -->
  <text x="16" y="18.4" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="5.6" font-weight="900" fill="#f5f5f5">&lt;/&gt;</text>

  <!-- front half of the orbits (lower halves pass in front of the sphere) -->
  <g fill="none" stroke="#f5f5f5" stroke-width="1.2" stroke-linecap="round">
    <ellipse cx="16" cy="16" rx="14" ry="5" transform="rotate(-28 16 16)" pathLength="100" stroke-dasharray="50 50"/>
    <ellipse cx="16" cy="16" rx="14" ry="5" transform="rotate(32 16 16)" pathLength="100" stroke-dasharray="50 50"/>
  </g>

  <!-- electrons -->
  <circle cx="26.4" cy="22.4" r="1.7" fill="url(#ball)"/>
  <circle cx="5.2" cy="21.2" r="1.5" fill="url(#ball)"/>
</svg>
