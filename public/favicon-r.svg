  </defs>
  <!-- Dark circle background -->
  <circle cx="16" cy="16" r="16" fill="url(#bg)"/>
  <!-- Blue border ring -->
  <circle cx="16" cy="16" r="15" fill="none" stroke="#378add" stroke-width="1.2" opacity="0.7"/>
  <!-- </> text -->
  <text x="16" y="20.5" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="900" fill="url(#txt)">&lt;/&gt;</text>
